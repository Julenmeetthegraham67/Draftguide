<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Draft helper</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;800&family=Source+Sans+3:wght@400;600&display=swap">
<style>
:root{--bg:#f1f2f7;--surface:#fff;--ink:#1b1f2a;--muted:#5b6174;--line:#d9dbe6;--gem:#6d3bd9;--gem-soft:#e9e0fb;--me:#1f7a4d;--foe:#b4411f;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14161f;--surface:#1e2230;--ink:#eceef6;--muted:#a3a9bf;--line:#33384d;--gem:#a98bff;--gem-soft:#2b2447;--me:#5fd49a;--foe:#ff9a78}}
:root[data-theme="dark"]{--bg:#14161f;--surface:#1e2230;--ink:#eceef6;--muted:#a3a9bf;--line:#33384d;--gem:#a98bff;--gem-soft:#2b2447;--me:#5fd49a;--foe:#ff9a78}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:400 16px/1.4 "Source Sans 3",system-ui,sans-serif;overflow:hidden}
h1,h2,h3{font-family:"Bricolage Grotesque",system-ui,sans-serif;margin:0;line-height:1.1}
.app{height:100%;display:grid;grid-template-columns:320px 1fr}
.side{background:var(--surface);border-right:1px solid var(--line);padding:16px;display:flex;flex-direction:column;gap:12px;min-height:0}
.side h1{font-weight:800;font-size:1.5rem}
label{font-weight:600;font-size:.9rem;color:var(--muted)}
select,button{font:600 1rem "Source Sans 3",system-ui,sans-serif;color:var(--ink);background:var(--surface);border:2px solid var(--line);border-radius:10px;padding:9px 12px}
select{width:100%;margin-top:4px}
button{cursor:pointer}
button:focus-visible,select:focus-visible{outline:3px solid var(--gem);outline-offset:2px}
button[aria-pressed="true"]{background:var(--gem);border-color:var(--gem);color:#fff}
.mapimg{flex:1;min-height:120px;max-height:260px;border-radius:12px;border:1px solid var(--line);overflow:hidden;position:relative;background:linear-gradient(135deg,var(--gem-soft),var(--surface))}
.mapimg svg{position:absolute;inset:0;width:100%;height:100%;opacity:.35}
.cap{position:absolute;left:0;right:0;bottom:0;padding:10px 12px;background:rgba(0,0,0,.55);color:#fff}
.cap b{font:800 1.1rem "Bricolage Grotesque",system-ui,sans-serif;display:block}
.cap span{font-size:.85rem;opacity:.85}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:4px}
.mini{display:flex;gap:8px}
.mini button{flex:1;padding:7px}
.main{display:flex;flex-direction:column;gap:10px;padding:14px 16px;min-width:0;min-height:0}
.bar{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.team{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:8px 10px}
.team h3{font-size:.95rem;margin-bottom:4px}
.team.me h3{color:var(--me)}.team.foe h3{color:var(--foe)}
.slots{display:flex;gap:5px;flex-wrap:wrap}
.bans{display:flex;align-items:center;gap:10px;flex-wrap:wrap}.bans h3{font-size:.95rem}
.slot{min-width:64px;padding:3px 7px;border-radius:8px;border:1px dashed var(--line);font-size:.85rem;color:var(--muted)}
.slot.pick{border-style:solid;color:var(--ink);font-weight:600}
.slot.ban{text-decoration:line-through;border-style:solid}
.turn{background:var(--gem-soft);border-left:6px solid var(--gem);border-radius:4px 12px 12px 4px;padding:8px 14px;font-weight:600}
.grid{flex:1;min-height:0;overflow:auto;display:grid;grid-template-columns:repeat(auto-fill,minmax(64px,1fr));grid-auto-rows:62px;gap:6px;padding:6px 6px 0 0}
.tile{position:relative;border-radius:12px;border:2px solid transparent;color:#fff;font:800 .72rem/1.05 "Bricolage Grotesque",system-ui,sans-serif;text-shadow:0 1px 2px rgba(0,0,0,.4);padding:2px}
.tile[disabled]{opacity:.3;cursor:not-allowed}
.tile{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px}
.tile img{width:36px;height:36px;object-fit:contain;pointer-events:none}
.tile .nm{font-size:.62rem;line-height:1.05}
.mapimg img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.mapimg.has{background:var(--surface);flex:none;min-height:0;max-height:none}
.mapimg.has svg{display:none}
.mapimg.has img{position:static;display:block;width:100%;height:auto;max-height:46vh;object-fit:contain}
.mapimg.has .cap{position:static;background:none;color:var(--ink);padding:8px 10px}
.tile.rec{border-color:var(--ink);box-shadow:0 0 0 3px var(--gem)}
.tile.dim{filter:brightness(.45) saturate(.5)}
.badge{position:absolute;top:-8px;right:-6px;background:var(--gem);color:#fff;border-radius:99px;font:600 .75rem "Source Sans 3",sans-serif;padding:0 7px;text-shadow:none}
.recs{display:flex;gap:8px;flex-wrap:wrap}
.rc{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:6px 12px;font-size:.92rem}
.rc small{display:block;color:var(--muted)}
.warn{color:var(--foe);font-weight:600}
.hint{margin:0;color:var(--muted);font-size:.8rem}.hint a{color:var(--gem)}
@media (max-width:700px){body{overflow:auto}.app{display:block;height:auto}.side{border-right:0;border-bottom:1px solid var(--line)}.mapimg{height:150px;flex:none}.grid{overflow:visible}}
</style>
</head>
<body>
<div class="app">
<aside class="side">
<h1>Draft helper</h1>
<div><label for="map">Mapa</label>
<select id="map"></select></div>
<div class="mapimg" id="img" aria-label="Imagen del mapa">
<img id="mimg" alt="">
<svg viewBox="0 0 100 60" preserveAspectRatio="none" aria-hidden="true"><path d="M0 40 L20 25 L35 38 L55 15 L75 35 L100 20 L100 60 L0 60Z" fill="currentColor"/></svg>
<div class="cap"><b id="mname"></b><span id="mmode"></span></div>
</div>
<div><label>Tu pick</label>
<div class="seg"><button type="button" id="b-first" aria-pressed="false">First pick</button><button type="button" id="b-last" aria-pressed="false">Last pick</button></div></div>
<div class="mini"><button id="undo">Deshacer</button><button id="reset">Reiniciar</button></div>
<p class="hint">Este material no es oficial y no está respaldado por Supercell. Para obtener más información, consulte la <a href="http://supercell.com/en/fan-content-policy/es/" target="_blank" rel="noopener">Política de contenidos de fans</a>.</p>
<p class="hint"><a href="como-funciona.html">Cómo funciona</a> · <a href="privacidad.html">Privacidad</a> · <a href="contacto.html">Contacto</a> · <a href="sobre-mi.html">Sobre mí</a></p>
</aside>
<section class="main">
<div class="turn" id="turn" aria-live="polite"></div>
<div class="bans"><h3>Baneos</h3><div class="slots" id="s-ban"></div></div>
<div class="grid" id="grid"></div>
<div class="recs" id="rec"></div>
<div class="bar">
<div class="team me"><h3>Tu equipo</h3><div class="slots" id="s-me"></div></div>
<div class="team foe"><h3>Rival</h3><div class="slots" id="s-foe"></div></div>
</div>
</section>
</div>
<script src="datos.js"></script>
<script>
DATA.roster.sort(function(a,b){return a.localeCompare(b)});
var first=null,log=[],map="Hard Rock Mine";
function $(id){return document.getElementById(id)}
function modeOf(m){for(var k in DATA.maps)if(DATA.maps[k].indexOf(m)>-1)return k}
function seq(){var f=first,o=f==="me"?"foe":"me",s=[],i;
 for(i=0;i<6;i++)s.push({t:"ban",team:null});
 if(f){[f,o,o,f,f,o].forEach(function(t){s.push({t:"pick",team:t})})}return s}
var PTS={S:5,A:4,B:3,C:2,D:1,F:0},B_UP=1,B_DOWN=1,cats={},base={};
Object.keys(DATA.tiers).forEach(function(c){["S","A","B","C","D","F"].forEach(function(t){(DATA.tiers[c][t]||[]).forEach(function(n,i){
 var e=cats[n]||(cats[n]={cs:[],best:-1,pos:99}),p=PTS[t];e.cs.push(c);
 if(p>e.best||(p===e.best&&i+1<e.pos)){e.best=p;e.pos=i+1}})})});
Object.keys(cats).forEach(function(n){var e=cats[n];base[n]=e.best-0.001*e.pos});
function ctrN(a,b){var n=0;a.forEach(function(x){b.forEach(function(y){if((DATA.catCounters[y]||[]).indexOf(x)>-1)n++})});return n}
function score(n){var e=cats[n]||{cs:[]},up=0,down=0,bad=[];
 log.forEach(function(l){if(l.t!=="pick"||l.team!=="foe")return;
  var rc=(cats[l.b]||{cs:[]}).cs;
  var u=ctrN(e.cs,rc),d=ctrN(rc,e.cs);up+=B_UP*u;
  if(d){down+=B_DOWN*d;bad.push(l.b)}});
 var m=(DATA.mapBonus[map]||{})[n]||0,b0=base[n]||0;
 return{n:n,base:b0,m:m,pre:b0+m,up:up,down:down,total:b0+m+up-down,bad:bad}}
function slug(n){return n.toLowerCase().replace(/&/g,"").replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"")}
function hue(n){var h=0;for(var i=0;i<n.length;i++)h=(h*31+n.charCodeAt(i))%360;return h}
function render(){
 $("mname").textContent=map;var mi=$("mimg"),box=$("img");mi.onload=function(){box.classList.add("has")};mi.onerror=function(){if(mi.dataset.t!=="1"){mi.dataset.t="1";mi.src="img/maps/"+slug(map)+".png"}else{mi.style.display="none";box.classList.remove("has")}};if(mi.dataset.m!==map){mi.dataset.m=map;mi.dataset.t="";box.classList.remove("has");mi.style.display="";mi.src="img/maps/"+slug(map)+".webp"}$("mmode").textContent=modeOf(map);
 $("b-first").setAttribute("aria-pressed",first==="me");$("b-last").setAttribute("aria-pressed",first==="foe");
 var S=seq(),step=S[log.length],taken={};
 log.forEach(function(l){taken[l.b]=l});
 ["me","foe","ban"].forEach(function(t){var el=$("s-"+t);el.innerHTML="";
  S.forEach(function(st,i){if(t==="ban"?st.t!=="ban":st.team!==t)return;
   var d=document.createElement("div"),l=log[i];
   d.className="slot"+(l?" "+l.t:"");d.textContent=l?l.b:(st.t==="ban"?"Ban":"Pick");el.appendChild(d)})});
 var recs=[],hasData=true;
 if(step){var p=step.t==="pick";
  recs=DATA.roster.filter(function(n){return!taken[n]}).map(score)
   .sort(function(a,b){return p?b.total-a.total:b.pre-a.pre}).slice(0,5);
  $("turn").textContent=p?(step.team==="me"?"Tu equipo":"El rival")+" elige (pick "+(log.length-5)+" de 6)":"Baneos: brawler "+(log.length+1)+" de 6, valen para los dos equipos";
 }else $("turn").textContent=first?"Draft completo.":"Baneos hechos. Elige first pick o last pick para empezar los picks.";
 var g=$("grid");g.innerHTML="";
 var DIM_BELOW=2,pk=!!step&&step.t==="pick",sc={};
 DATA.roster.forEach(function(n){sc[n]=score(n)});
 var order=DATA.roster.slice().sort(function(a,b){if(!!taken[a]!==!!taken[b])return taken[a]?1:-1;var d=pk?sc[b].total-sc[a].total:sc[b].pre-sc[a].pre;return d||a.localeCompare(b)});
 order.forEach(function(n){var b=document.createElement("button"),k=recs.map(function(r){return r.n}).indexOf(n),dim=!taken[n]&&!!step&&(pk?sc[n].total:sc[n].pre)<=DIM_BELOW;
  b.className="tile"+(k>-1&&k<3?" rec":"")+(dim?" dim":"");b.style.background="hsl("+hue(n)+",55%,38%)";
  var im=document.createElement("img");im.alt="";im.src="img/"+slug(n)+".png";im.onerror=function(){im.remove()};b.appendChild(im);var nm=document.createElement("span");nm.className="nm";nm.textContent=n;b.appendChild(nm);b.disabled=!step||!!taken[n];
  if(k>-1&&k<3){var s=document.createElement("span");s.className="badge";s.textContent="#"+(k+1);b.appendChild(s)}
  b.onclick=function(){log.push({t:step.t,team:step.team,b:n});render()};g.appendChild(b)});
 var ul=$("rec");ul.innerHTML="";
 if(step&&!recs.length){var e=document.createElement("div");e.className="rc";e.textContent=hasData?"Sin recomendaciones con los datos actuales.":"Sin datos para este mapa todavía.";ul.appendChild(e)}
 recs.forEach(function(r){var d=document.createElement("div"),a=document.createElement("b"),s=document.createElement("small");
  d.className="rc";a.textContent=r.n;
  s.textContent=step.t==="pick"?"Base "+r.base.toFixed(2)+(r.m?" + mapa "+r.m:"")+" + counters "+r.up+" − desventaja "+r.down+" = "+r.total.toFixed(2):"Base "+r.pre.toFixed(2);
  d.appendChild(a);d.appendChild(s);
  if(r.bad.length){var w=document.createElement("small");w.className="warn";w.textContent="Lo frena: "+r.bad.join(", ");d.appendChild(w)}
  ul.appendChild(d)})}
var sel=$("map");
Object.keys(DATA.maps).forEach(function(m){var og=document.createElement("optgroup");og.label=m;
 DATA.maps[m].forEach(function(n){var o=document.createElement("option");o.value=n;o.textContent=n;og.appendChild(o)});sel.appendChild(og)});
sel.value=map;
sel.onchange=function(){map=sel.value;log=[];render()};
function keepBans(){log=log.filter(function(l){return l.t==="ban"})}
$("b-first").onclick=function(){first="me";keepBans();render()};
$("b-last").onclick=function(){first="foe";keepBans();render()};
$("undo").onclick=function(){log.pop();render()};
$("reset").onclick=function(){first=null;log=[];render()};
render();
</script>
</body>
</html>
